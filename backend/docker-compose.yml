version: '3.8'

services:
  api:
    build: .
    container_name: cybersec-platform-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/cybersec_platform
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - ENVIRONMENT=production
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped
    networks:
      - cybersec-network

  db:
    image: postgres:15-alpine
    container_name: cybersec-platform-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cybersec_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - cybersec-network

  redis:
    image: redis:7-alpine
    container_name: cybersec-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cybersec-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cybersec-platform-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - cybersec-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: cybersec-platform-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - cybersec-network

  worker:
    build: .
    container_name: cybersec-platform-worker
    command: ["celery", "-A", "platform.worker", "worker", "--loglevel=info", "--concurrency=4"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/cybersec_platform
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - kafka
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped
    networks:
      - cybersec-network

volumes:
  postgres_data:
  redis_data:

networks:
  cybersec-network:
    driver: bridge
