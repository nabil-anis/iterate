apiVersion: apps/v1
kind: Deployment
metadata:
  name: cybersec-platform-worker
  labels:
    app: cybersec-platform
    tier: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cybersec-platform
      tier: worker
  template:
    metadata:
      labels:
        app: cybersec-platform
        tier: worker
    spec:
      containers:
      - name: worker
        image: cybersec-platform:latest
        command: ["celery", "-A", "platform.worker", "worker", "--loglevel=info", "--concurrency=4"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: url
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-service:9092"
        resources:
          requests:
            memory: "1Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "4"
