apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cybersec-platform-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - platform.cybersec.local
    secretName: cybersec-platform-tls
  rules:
  - host: platform.cybersec.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cybersec-platform-service
            port:
              number: 80
